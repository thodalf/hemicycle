[build]
  command = "npm run build"
  publish = "dist/polsim/browser"

[build.environment]
  NODE_VERSION = "22"

# Application monopage : toutes les routes servent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Webapp : le service worker et son manifeste ne doivent jamais rester en cache
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
